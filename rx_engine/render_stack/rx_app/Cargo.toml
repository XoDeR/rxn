[package]
name = "rx_app"
version = "0.1.0"
edition = "2024"

[dependencies]
rx_ids.workspace = true
rx_project.workspace = true
rx_runtime.workspace = true

[features]
[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
