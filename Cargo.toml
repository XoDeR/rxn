[workspace]
members = [
    "rx_engine/core/rx_ids", 
    "rx_engine/core/rx_nodes", 
    "rx_engine/core/rx_structs",
    "rx_engine/runtime_project/rx_runtime", 
    "examples/scene_nodes",
    "examples/window",
    "rx_engine/render_stack/rx_app", 
    "rx_engine/runtime_project/rx_project"
, "rx_engine/render_stack/rx_render_bridge"]

resolver = "3"

[workspace.dependencies]
rx_ids = { version = "0.1.0", path = "rx_engine/core/rx_ids" }
rx_nodes = { version = "0.1.0", path = "rx_engine/core/rx_nodes" }
rx_structs = { version = "0.1.0", path = "rx_engine/core/rx_structs" }

rx_runtime = { version = "0.1.0", path = "rx_engine/runtime_project/rx_runtime" }
rx_project = { version = "0.1.0", path = "rx_engine/runtime_project/rx_project" }
rx_app = { version = "0.1.0", path = "rx_engine/render_stack/rx_app" }
